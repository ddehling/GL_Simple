id: weight_of_light
display_name: Weight of Light
brightness_limit: 0.2
# Target render FPS for the main loop. Lower values save CPU + DDP
# bandwidth on bandwidth-tight networks. Engine default is 40 fps
# when this key is absent.
target_fps: 40
weather_sets_module: projects.weight_of_light.weather_params
event_map_module: projects.weight_of_light.event_map
# Per-project capability hooks. Imported on engine boot and again on
# project swap. ``button_router`` registers OSC route handlers + builds
# the host -> object_id map for incoming /wol/<host>/button/<idx>
# messages. ``random_events`` runs once per frame for project-specific
# probability rolls (currently: lightning when in WOL_RAIN). See
# projects/weight_of_light/{button_router,random_events}.py.
hooks:
  button_router: projects.weight_of_light.button_router
  random_events: projects.weight_of_light.random_events
# Outbound OSC port that ProjectOscSender targets when sending feedback
# back to a box. Boxes should listen on this port; resolver looks up
# the host portion via mDNS.
osc:
  return_port: 9000
groups:
- id: Sky
  width: 300
  height: 19
- id: Ground
  width: 300
  height: 9
enable_random_events: true
geometry:
  type: multi_object
  file: projects/weight_of_light/geometry.yaml
receivers:
- host: wol-central.local
  protocol: ddp
  object_id: 0
  strips:
  - group: Ground
    strip_idx: 0
    kind: row
    length: 300
    direction: right
    shape: arc
    arc_center:
    - 640
    - 512
    arc_radius: 80.0
    arc_start_deg: 90.0
    arc_end_deg: -270.0
    arc_segments: 16
  - group: Sky
    strip_idx: 0
    kind: row
    length: 300
    direction: right
  - group: Sky
    strip_idx: 1
