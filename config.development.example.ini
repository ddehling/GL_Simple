# Example configuration for DEVELOPMENT mode
# Copy this to config.ini to use these settings

[Display]
# Show window for development and debugging
show_rendering_window = True
magnification = 4
# Enable FPS counter to monitor performance
show_fps = True
target_fps = 40

[Audio]
# Use default microphone
microphone_device = 

[WebControl]
enable_web_control = True
web_port = 5000
service_name = glsimple-dev
admin_password = devpass123

[Startup]
# Start with a specific scene for testing
startup_weather_set = ocean
startup_weather_state = OCEAN_KELP_FOREST
immediate_startup = True

[Performance]
frame_dimensions = 128,300
use_shader_renderer = True
enable_precision_timing = True

[Debug]
# Enable debug features
debug_mode = True
show_tree = False
show_skyfull = False
