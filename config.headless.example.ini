# Example configuration for HEADLESS/HIGH PERFORMANCE mode
# Copy this to config.ini to use these settings

[Display]
# Disable rendering window for maximum performance
show_rendering_window = False
magnification = 3
show_fps = False
target_fps = 60

[Audio]
microphone_device = TONOR

[WebControl]
# Keep web control enabled for remote management
enable_web_control = True
web_port = 5000
service_name = glsimple
admin_password = admin123

[Startup]
# Start with default settings
startup_weather_set = 
startup_weather_state = 
immediate_startup = True

[Performance]
frame_dimensions = 128,300
use_shader_renderer = True
enable_precision_timing = True

[Debug]
debug_mode = False
show_tree = False
show_skyfull = False
