# GL_Simple configuration
#
# THIS FILE: machine-local settings only — hardware/network for THIS
# physical machine. Edit when you swap microphones, change the web port,
# pin a NIC, etc. Survives across project switches.
#
# PROJECT SETTINGS live under ``projects/<id>/``, NOT here:
#   projects/fan/project.yaml                       — Fan groups + receivers + geometry
#   projects/weight_of_light/project.yaml           — WoL groups + receivers + geometry
#   projects/weight_of_light/receiver_addresses.yaml  — WoL hardware addresses (optional override)
#   projects/<id>/event_map.py                      — effect catalog for that project
#   projects/<id>/weather_params.py                 — weather sets / states for that project
#
# Default active project - the FALLBACK when no per-machine override exists.
# Per-machine selection lives in ``active_project.yaml`` (gitignored, written
# by bin/setup.*) which overrides this. Override at launch with ``--project
# <id>``. Available IDs are whatever subdirs exist under ``projects/``
# containing a ``project.yaml``. Don't change this for a one-off project
# swap on your machine - edit active_project.yaml instead.
project: fan

display:
  width: 128          # LED strips (framebuffer columns)
  height: 300         # LEDs per strip (framebuffer rows)
  magnification: 0    # Window magnification (0 = auto-scale to monitor)
  headless: true     # true = no desktop window, web preview only

audio:
  enabled: true         # Set false to run without audio analysis (e.g. remote/headless)
  # Active input source for the audio-reactive visuals. One at a time;
  # switchable live (MIDI R1 cycles; web request_audio_source). Options:
  #   linein     - wired line/aux input (DJ mixer/decks). Cleanest; DJ default.
  #   loopback   - whatever the computer plays (WASAPI loopback on Windows,
  #                monitor source on Linux, Stereo Mix fallback)
  #   internal   - the show's own AudioEngine mix (clean digital tap, no mic)
  #   microphone - open mic (picks up room noise; legacy)
  source: "linein"
  linein_device: ""     # name fragment of the wired input (empty = auto-pick a line/aux input)
  loopback_device: ""   # force a specific loopback/monitor by name (empty = auto per-OS)
  device_name: "TONOR"  # Microphone device name when source: microphone (tools/editors/sound_editor.py)

dj:
  # Tempo engine for the decks. MEASURED on this machine (Intel N150,
  # 4 cores) as % of one core spent inside the audio callback during a
  # two-deck blend - the moment that has to stay under the deadline:
  #   vari              23%   no keylock (pitch rides tempo on every seam)
  #   rubberband-crisp  27%   R2 keylock - constant pitch, ~varispeed cost
  #   rubberband        43%   R3 keylock - warble-free, but nearly 2x R2
  # R3 ("rubberband") is the upstream default and the one picked by ear.
  # Measured in the REAL app, DJ running, 6 forced transitions:
  #   before the render-ahead ring, R3  44/699 blocks starved (6.3%)
  #   before the render-ahead ring, R2   2/663 blocks starved (0.3%)
  #   with the ring (lib/audio_engine.py), R3   0 underruns
  # The ring took rendering off the device callback, so R3's cost no
  # longer has to fit inside one buffer deadline - it only has to average
  # under realtime, which it does. "rubberband-crisp" (R2) remains the
  # cheap fallback if a heavier project ever pushes the average up.
  # NOTE: measure this in the show, never standalone - a standalone bench
  # understates in-callback time ~4x because it lacks the GL/web/DMX
  # threads competing for the GIL.
  stretch_engine: "rubberband"

gen:
  # Generative note-level music (lib/gen; docs/GENERATIVE_MUSIC_PLAN.md).
  # enabled gates AVAILABILITY only - it never auto-plays; start it from
  # the web panel's Gen tab (/gen). Live steering from the page is kept
  # here for the session (style, key, bpm, energy, density, ...).
  enabled: true
  style: groove            # groove | downtempo | ambient
  key: "8A"                # Camelot (8A = A minor) or a name (Am, C, F#m)
  # bpm: 124               # omit = the style's own tempo
  set_length_s: 10800      # arc length; the arc CYCLES (movements) all night
  fluid_slots: ""          # e.g. "keys,pad" to render those on SoundFonts
  # soundfont: /usr/share/sounds/sf2/FluidR3_GM.sf2   # apt: fluid-soundfont-gm
  master: 0.8

midi:
  enabled: true             # Korg nanoKontrol2 live control for the Club / DJ set
  device_name: "nanoKONTROL2"  # Partial, case-insensitive MIDI device name match
  # Absent hardware (or no pygame.midi backend) is non-fatal - the show
  # runs without MIDI. Set enabled: false to skip the MIDI probe entirely.

web:
  enabled: true
  port: 80
  bind_ip: ""  # Advertise mDNS (lucifera.local) on this interface only (empty = all interfaces)
  # bind_ip: "192.168.0.236"  # Example: pin to wired network

osc:
  # Listen for inbound OSC from EtherNode boxes (button presses,
  # analog samples, 1-Wire temps). Observability only for now —
  # incoming messages get logged via print(). Mapping into actual
  # events is a later step.
  enabled: true
  port: 9001
  bind_ip: "0.0.0.0"   # all interfaces; set to a specific IP to pin

dmx:
  bind_ip: ""  # Send DMX from this interface (empty = default route)
  # bind_ip: "192.168.0.236"  # Example: pin to wired network

  # The ``receivers`` list below is a LEGACY FALLBACK only used when the
  # active project's ``project.yaml`` doesn't define its own ``receivers:``
  # block. Both Fan and WoL define their own, so these entries are
  # ignored at runtime today — kept here as a reference for the legacy
  # ``columns`` / ``column_offset`` / ``addressing`` schema.
  #
  # To configure receivers for the active project, edit
  # ``projects/<id>/project.yaml`` directly. WoL's layout can also be
  # edited interactively via ``python tools/layout_editor.py``.
  #
  # Per-receiver schema (legacy form):
  #   ``ip:``       literal dotted-quad (always works)
  #   ``host:``     mDNS hostname like "ethernode-7f928c" — resolved at startup
  #                 via the OS resolver, falling back to a _ethernode._tcp.local
  #                 zeroconf browse. Survives DHCP changes; preferred when
  #                 available. If both ``ip:`` and ``host:`` are set, host
  #                 wins, with ip as a fallback if mDNS misses.
  #   ``protocol:`` ``"sacn"`` (default) or ``"ddp"``
  #     sacn: E1.31 multicast/unicast on UDP 5568, 510 bytes/packet
  #     ddp:  Distributed Display Protocol on UDP 4048, ~1440 bytes/packet
  #           (preferred for big pixel counts — fewer packets per frame
  #           avoids the receiver's ETH RX buffer cliff at ~6 packets/burst)
  receivers:
    # Lucifera
    # Example: addressing by mDNS hostname instead of IP. Uncomment to use.
    # - host: "ethernode-7f928c"   # ← stable across DHCP rotations
    #   ip:   "192.168.68.140"   # optional fallback if mDNS misses
    #   protocol: "sacn"
    #   columns: 32
    #   column_offset: 0
    - ip: "192.168.68.140"
      protocol: "sacn"
      columns: 32
      column_offset: 0
    - ip: "192.168.68.141"
      columns: 32
      column_offset: 32
    - ip: "192.168.68.142"
      columns: 32
      column_offset: 64
    - ip: "192.168.68.143"
      columns: 32
      column_offset: 96
    - host: "ethernode-7f928c.local"
      protocol: "ddp"
      columns: 8
      column_offset: 6  
    # (Legacy Bean entries with ``addressing: file: config/UnitX.txt``
    # were removed along with the Unit*.txt files; if you need to
    # reintroduce that hardware, use the strip-form ``receivers:``
    # block in ``projects/<id>/project.yaml`` instead.)
    # Raspberry Pi test receiver
    # - ip: "192.168.0.155"
    #   columns: 32
    #   column_offset: 0
