<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucifera DJ</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/control_panel.css">
    <style>
        /* Live show control ONLY - deep set building lives in the desktop
           planner (tools/dj_planner.py); this drives the running show. */
        .dj-banner {
            padding: 10px 14px; border-radius: 8px; margin-bottom: 10px;
            font-size: 0.9em; border: 1px solid #444; background: #23232a;
        }
        .dj-banner.on { border-color: #3a6; background: #123020; color: #9f9; }
        .dj-banner.err { border-color: #a33; background: #301515; color: #f99; }
        .btn {
            border-radius: 8px; border: 2px solid #555; background: #2a2a2e;
            color: #ddd; cursor: pointer; padding: 12px; font-size: 1.0em;
        }
        .btn:active { filter: brightness(1.3); }
        .btn.go { border-color: #3a6; background: #123a22; color: #9f9;
                  font-weight: bold; }
        .btn.stop { border-color: #a33; background: #401515; color: #f99; }
        .btn.skip { border-color: #46a; background: #14203a; color: #9bf; }
        .btn.wide { width: 100%; }
        .btn.on { border-color: #3a6; background: #123a22; color: #9f9; }
        .transport { display: flex; gap: 8px; margin-bottom: 10px; }
        .transport .btn { flex: 1; }
        .now-title { font-size: 1.25em; font-weight: bold; }
        .now-sub { font-size: 0.85em; opacity: 0.7; }
        .kv { display: flex; justify-content: space-between; font-size: 0.85em;
              padding: 2px 0; }
        .kv .k { opacity: 0.6; }
        .track-progress { height: 12px; background: #222; border-radius: 6px;
            overflow: hidden; margin: 8px 0 3px 0; }
        .track-progress .fill { height: 100%; border-radius: 6px;
            background: linear-gradient(90deg, #2a6, #4bd); transition: width .3s; }
        .deckrow { display: flex; gap: 8px; margin-top: 8px; }
        .deck {
            flex: 1; border: 1px solid #3a3a44; border-radius: 6px;
            padding: 6px 8px; font-size: 0.8em; background: #1e1e26;
        }
        .deck .name { font-weight: bold; color: #8cf; }
        .eqbars { display: flex; gap: 3px; height: 22px; align-items: flex-end;
                  margin-top: 4px; }
        .eqbars .b { flex: 1; border-radius: 2px 2px 0 0; }
        .next-box { border: 1px dashed #445; border-radius: 8px; padding: 10px;
            margin-top: 10px; }
        .arc-bar { position: relative; height: 18px; border-radius: 9px;
            background: linear-gradient(90deg,#223,#235,#526,#a24,#722);
            margin: 6px 0 2px 0; }
        .arc-marker { position: absolute; top: -4px; width: 4px; height: 26px;
            border-radius: 2px; transform: translateX(-2px); background: #fff;
            box-shadow: 0 0 6px #fff; }
        .bias-labels { display: flex; justify-content: space-between;
            font-size: 0.75em; opacity: 0.65; }
        .theme-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .theme-btn { flex: 1; min-width: 84px; padding: 9px 4px;
            font-size: 0.82em; border-radius: 6px; border: 1px solid #555;
            background: #26262e; color: #ccc; cursor: pointer; }
        .theme-btn.on { border-color: #4bd; background: #123a44; color: #9ef; }
        .setrow { display: flex; gap: 8px; margin-top: 8px; }
        .setrow select { flex: 1; padding: 9px; background: #26262e; color: #ccc;
            border: 1px solid #555; border-radius: 6px; }
        .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
        .badge { font-size: 0.75em; padding: 3px 10px; border-radius: 12px;
            background: #333; border: 1px solid #555; }
        .badge.tech { background: #1a2a4a; border-color: #36a; color: #8bf; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lucifera DJ</h1>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <div class="tabs">
            <a href="/" class="tab">Controls</a>
            <a href="/preview" class="tab">Preview</a>
            <a href="/weather_editor" class="tab">Editor</a>
            <a href="/club" class="tab" id="club-tab" style="display:none">Club</a>
            <a href="/dj" class="tab active" id="dj-tab">DJ</a>
        </div>

        <div class="dj-banner" id="dj-banner">Connecting to the show…</div>

        <!-- Transport is available whenever the DJ subsystem is available. -->
        <div class="transport" id="dj-transport" hidden>
            <button class="btn go" id="dj-start">▶ START DJ</button>
            <button class="btn stop hidden" id="dj-stop">■ STOP</button>
            <button class="btn skip hidden" id="dj-skip">⏭ SKIP</button>
            <button class="btn hidden" id="dj-auto">AUTOPILOT</button>
        </div>

        <!-- Now playing (active) -->
        <div class="section-panel hidden" id="dj-now">
            <div class="section-header"><h3>Now Playing</h3></div>
            <div class="now-title" id="dj-title">--</div>
            <div class="now-sub" id="dj-sub"></div>
            <div class="track-progress"><div class="fill" id="dj-prog"
                 style="width:0%"></div></div>
            <div class="bias-labels"><span id="dj-pos">0:00</span>
                <span id="dj-dur">0:00</span></div>
            <!-- Scrub within the current track (drag to seek). -->
            <input type="range" id="dj-scrub" min="0" max="1000" value="0"
                   style="width:100%; margin-top:4px">
            <div class="transport" style="margin-top:6px">
                <button class="btn" id="dj-restart">⟲ Start</button>
                <button class="btn" id="dj-back">−30s</button>
                <button class="btn" id="dj-fwd">+30s</button>
                <button class="btn" id="dj-toexit">⤓ To exit</button>
                <button class="btn skip" id="dj-mixnow">▶▶ Mix now</button>
            </div>
            <div class="badges" id="dj-badges"></div>
            <div class="deckrow" id="dj-decks"></div>
            <div class="next-box hidden" id="dj-next-box">
                <div class="now-sub">UP NEXT</div>
                <div id="dj-next" style="font-weight:bold"></div>
                <div class="now-sub" id="dj-next-sub"></div>
            </div>
        </div>

        <!-- The night (active) -->
        <div class="section-panel hidden" id="dj-nightcard">
            <div class="section-header"><h3>The Night</h3></div>
            <div class="arc-bar"><div class="arc-marker" id="dj-arc-mk"
                 style="left:0%"></div></div>
            <div class="bias-labels"><span>warm-up</span><span>peak</span>
                <span>landing</span></div>
            <div class="kv"><span class="k">Energy target</span>
                <span id="dj-heat">--</span></div>
            <div class="kv"><span class="k">Set position</span>
                <span id="dj-arcpct">--</span></div>
        </div>

        <!-- Prep / steer (always when available) -->
        <div class="section-panel hidden" id="dj-steer">
            <div class="section-header"><h3 id="dj-steer-h">Prepare</h3></div>
            <div class="now-sub">Theme</div>
            <div class="theme-row" id="dj-themes"></div>
            <div class="now-sub" style="margin-top:12px">Setlist</div>
            <div class="setrow">
                <select id="dj-setlist">
                    <option value="">(free play — autonomous)</option>
                </select>
                <button class="btn" id="dj-setlist-load"
                        style="width:auto">LOAD</button>
            </div>
            <div id="dj-nudge-wrap" style="margin-top:14px">
                <div class="bias-labels"><span>mellower</span>
                    <span>energy nudge</span><span>hotter</span></div>
                <input type="range" id="dj-nudge" min="-0.4" max="0.4"
                       step="0.05" value="0" style="width:100%">
            </div>
            <div class="now-sub" id="dj-libinfo" style="margin-top:10px"></div>
        </div>
    </div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/socket-client.js"></script>
    <script src="/static/js/club_tab.js"></script>
    <script src="/static/js/dj_tab.js"></script>
    <script>
        const socket = createSocket();
        const $ = (id) => document.getElementById(id);
        const THEMES = ["chill_evening", "groove", "peak_heavy",
                        "wind_down", "all_night"];
        const EQC = ["#eb695a", "#78d278", "#6eaaf0"];  // low/mid/high

        // Build theme buttons once.
        THEMES.forEach((t) => {
            const b = document.createElement("button");
            b.className = "theme-btn"; b.dataset.theme = t;
            b.textContent = t.replace(/_/g, " ");
            b.onclick = () => emit("theme", t);
            $("dj-themes").appendChild(b);
        });

        function emit(action, value) {
            socket.emit("dj_action", {action, value});
        }
        $("dj-start").onclick = () => emit("start");
        $("dj-stop").onclick = () => {
            if (confirm("Stop the DJ and hand the soundtrack back?"))
                emit("stop");
        };
        $("dj-skip").onclick = () => emit("skip");
        $("dj-auto").onclick = () =>
            emit("autopilot", !$("dj-auto").classList.contains("on"));
        $("dj-setlist-load").onclick = () =>
            emit("setlist", $("dj-setlist").value);

        let nudgeDragging = false;
        const nudge = $("dj-nudge");
        nudge.addEventListener("pointerdown", () => nudgeDragging = true);
        nudge.addEventListener("change", () => {
            nudgeDragging = false;
            emit("nudge", parseFloat(nudge.value));
        });

        // Jump controls (testing).
        $("dj-restart").onclick = () => emit("seek", 0);
        $("dj-back").onclick = () => emit("seek_rel", -30);
        $("dj-fwd").onclick = () => emit("seek_rel", 30);
        $("dj-toexit").onclick = () => emit("to_exit");
        $("dj-mixnow").onclick = () => emit("mix_now");

        // Scrubber: drag to seek within the current track. Drag-guard so the
        // 5Hz snapshot doesn't yank the thumb while you're dragging.
        let scrubbing = false, curDur = 0;
        const scrub = $("dj-scrub");
        scrub.addEventListener("pointerdown", () => scrubbing = true);
        scrub.addEventListener("change", () => {
            scrubbing = false;
            if (curDur > 0)
                emit("seek", (parseFloat(scrub.value) / 1000) * curDur);
        });

        const fmt = (s) => s == null ? "-:--" :
            Math.floor(Math.max(0, s) / 60) + ":" +
            String(Math.floor(Math.max(0, s) % 60)).padStart(2, "0");
        const show = (el, on) => el.classList.toggle("hidden", !on);

        function renderDecks(decks) {
            if (!decks || !decks.length) { $("dj-decks").innerHTML = ""; return; }
            $("dj-decks").innerHTML = decks.map((d) => {
                const eq = (d.eq || [1, 1, 1]).map((v, i) =>
                    `<div class="b" style="height:${Math.round(6 + 16 * Math.min(v, 1))}px;background:${EQC[i]}"></div>`
                ).join("");
                const bpm = d.bpm ? `${d.bpm.toFixed(1)} bpm` : "";
                const bend = (d.rate_pct !== undefined && d.rate_pct !== 0)
                    ? ` <span style="color:#8cf">${d.rate_pct > 0 ? "+" : ""}${d.rate_pct}%</span>` : "";
                const sync = d.synced
                    ? ` <span style="color:#6f6">SYNC</span>` : "";
                return `<div class="deck"><span class="name">${d.deck}</span>
                    <span style="opacity:.55"> gain ${d.gain}</span>
                    <span style="opacity:.9"> ${bpm}${bend}${sync}</span><br>
                    <span>${(d.title || "?").slice(0, 22)}</span>
                    <div class="eqbars">${eq}</div></div>`;
            }).join("");
        }

        function fillSetlists(names, current) {
            const sel = $("dj-setlist");
            const key = (names || []).join("|");
            if (sel.dataset.have !== key) {
                sel.dataset.have = key;
                const keep = sel.value;
                sel.innerHTML = '<option value="">(free play — autonomous)</option>'
                    + (names || []).map((n) =>
                        `<option value="${n}">${n}</option>`).join("");
                sel.value = current || keep || "";
            }
        }

        socket.on("state_update", (s) => {
            $("status-text").textContent = "Connected";
            const dj = s.dj;
            const banner = $("dj-banner");

            if (!dj) {
                banner.className = "dj-banner err";
                banner.textContent =
                    "DJ subsystem not reported by the show. Is the app running "
                    + "with dj.enabled and a scanned library?";
                $("dj-transport").hidden = true;
                ["dj-now", "dj-nightcard", "dj-steer"].forEach(
                    (id) => show($(id), false));
                return;
            }
            const on = !!dj.active;
            $("dj-transport").hidden = false;
            show($("dj-steer"), true);
            show($("dj-now"), on);
            show($("dj-nightcard"), on);

            // Transport buttons.
            show($("dj-start"), !on);
            show($("dj-stop"), on);
            show($("dj-skip"), on);
            show($("dj-auto"), on);
            $("dj-auto").classList.toggle("on", !!dj.autopilot);
            $("dj-auto").textContent = "AUTOPILOT: " + (dj.autopilot ? "ON" : "OFF");
            $("dj-steer-h").textContent = on ? "Steer" : "Prepare";
            show($("dj-nudge-wrap"), on);

            // Banner.
            if (dj.error) {
                banner.className = "dj-banner err";
                banner.textContent = "⚠ " + dj.error;
            } else if (on) {
                banner.className = "dj-banner on";
                banner.textContent = "DJ live — driving the soundtrack"
                    + (dj.setlist ? ` · setlist “${dj.setlist}” (${dj.setlist_remaining} left)` : " · free play");
            } else {
                banner.className = "dj-banner";
                banner.textContent = "DJ idle. Pick a theme/setlist, then START. "
                    + "Starting pauses state ambient and points the visuals at the mix.";
            }
            $("dj-libinfo").textContent = dj.music_dir
                ? "library: " + dj.music_dir : "";

            // Theme highlight + setlist options (work idle and live).
            document.querySelectorAll(".theme-btn").forEach((b) =>
                b.classList.toggle("on", b.dataset.theme === dj.theme));
            fillSetlists(dj.setlists, dj.setlist);
            if (!nudgeDragging && dj.energy_nudge != null)
                nudge.value = dj.energy_nudge;

            if (!on) return;

            // Now playing.
            const cur = dj.current || {};
            $("dj-title").textContent = cur.title || "(choosing next track…)";
            $("dj-sub").textContent = [cur.artist,
                cur.bpm ? Math.round(cur.bpm) + " bpm" : null,
                cur.camelot].filter(Boolean).join("  ·  ");
            $("dj-pos").textContent = fmt(cur.pos_s);
            $("dj-dur").textContent = fmt(cur.duration_s);
            const frac = cur.duration_s
                ? Math.min(1, (cur.pos_s || 0) / cur.duration_s) : 0;
            $("dj-prog").style.width = (100 * frac) + "%";
            curDur = cur.duration_s || 0;
            if (!scrubbing) scrub.value = Math.round(frac * 1000);

            const badges = [];
            if (dj.state === "armed" && dj.style)
                badges.push(`<span class="badge tech">${dj.style.replace(/_/g," ")}`
                    + (dj.blend_in_s != null ? ` in ${Math.round(dj.blend_in_s)}s` : "")
                    + `</span>`);
            badges.push(`<span class="badge">theme: ${dj.theme}</span>`);
            badges.push(`<span class="badge">${dj.state}</span>`);
            $("dj-badges").innerHTML = badges.join("");
            renderDecks(dj.decks);

            if (dj.next) {
                show($("dj-next-box"), true);
                $("dj-next").textContent = dj.next.title;
                $("dj-next-sub").textContent =
                    [dj.next.artist, dj.next.bpm ? Math.round(dj.next.bpm)+" bpm":null,
                     dj.next.camelot, dj.style ? "via "+dj.style.replace(/_/g," "):null]
                    .filter(Boolean).join("  ·  ");
            } else show($("dj-next-box"), false);

            // The night.
            $("dj-arc-mk").style.left = (100 * (dj.arc_phase || 0)) + "%";
            $("dj-heat").textContent = (dj.arc_heat != null ? dj.arc_heat.toFixed(2) : "--")
                + (dj.energy_nudge ? `  (nudge ${dj.energy_nudge>0?"+":""}${dj.energy_nudge})` : "");
            $("dj-arcpct").textContent = Math.round(100 * (dj.arc_phase || 0)) + "%"
                + (dj.night_hours ? ` of a ${dj.night_hours}h night` : "");
        });

        socket.on("disconnect", () => {
            $("status-text").textContent = "Disconnected";
            $("dj-banner").className = "dj-banner err";
            $("dj-banner").textContent = "Disconnected from the show.";
        });
    </script>
</body>
</html>
