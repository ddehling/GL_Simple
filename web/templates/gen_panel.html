<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e3c72">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lucifera Gen">
    <title>Lucifera Gen</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/control_panel.css">
    <link rel="stylesheet" href="/static/css/gen.css">
</head>
<body>
    <!-- The generative music control surface. This page is a SHELL: what
         it shows comes from /api/gen/surface (lib/gen/ui.py) rendered by
         the widget registry in /static/js/gen/. See docs/GENERATIVE_UI.md. -->
    <div class="container">
        <header>
            <h1>Lucifera Gen</h1>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <div class="tabs">
            <a href="/" class="tab">Controls</a>
            <a href="/preview" class="tab">Preview</a>
            <a href="/weather_editor" class="tab">Editor</a>
            <a href="/club" class="tab" id="club-tab" style="display:none">Club</a>
            <a href="/gen" class="tab active" id="gen-tab">Gen</a>
            <a href="/interaction" class="tab" id="interaction-tab" style="display:none">Interaction</a>
        </div>

        <div id="surface" class="surface"><div class="gen-banner">Loading the surface…</div></div>
    </div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/socket-client.js"></script>
    <script src="/static/js/club_tab.js"></script>
    <script src="/static/js/gen_tab.js"></script>
    <script src="/static/js/interaction_tab.js"></script>
    <script type="module" src="/static/js/gen/index.js"></script>
</body>
</html>
