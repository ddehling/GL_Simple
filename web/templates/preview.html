<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucifera Preview</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/preview.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lucifera</h1>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <div class="tabs">
            <a href="/" class="tab">Controls</a>
            <a href="/preview" class="tab active">Preview</a>
            <a href="/weather_editor" class="tab">Editor</a>
            <a href="/club" class="tab" id="club-tab" style="display:none">Club</a>
            <a href="/interaction" class="tab" id="interaction-tab" style="display:none">Interaction</a>
        </div>

        <div class="preview-weather">
            <label for="preview-set-selector" class="preview-weather-label">Set:</label>
            <select id="preview-set-selector" class="preview-selector">
                <option value="">Loading...</option>
            </select>
            <span class="preview-weather-sep">&middot;</span>
            <label for="preview-state-selector" class="preview-weather-label">Weather:</label>
            <select id="preview-state-selector" class="preview-selector">
                <option value="">Loading...</option>
            </select>
        </div>
        <div class="preview-now" id="preview-now">
            <span class="preview-now-label">Now:</span>
            <span id="preview-now-set" class="preview-now-value">--</span>
            <span class="preview-now-sep">/</span>
            <span id="preview-now-weather" class="preview-now-value">--</span>
            <span id="preview-now-transition" class="preview-now-transition"></span>
        </div>

        <div class="preview-controls">
            <button class="mode-btn active" data-mode="flat-smooth">Flat Smooth</button>
            <button class="mode-btn" data-mode="fan-smooth">Fan Smooth</button>
            <button class="mode-btn" data-mode="flat-led">Flat LED</button>
            <button class="mode-btn" data-mode="fan-led">Fan LED</button>
            <span id="preview-fps" class="fps-label">-- FPS</span>
        </div>

        <div class="canvas-wrapper">
            <canvas id="preview-canvas"></canvas>
        </div>
    </div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/socket-client.js"></script>
    <script src="/static/js/preview.js"></script>
    <script src="/static/js/club_tab.js"></script>
    <script src="/static/js/interaction_tab.js"></script>
</body>
</html>
