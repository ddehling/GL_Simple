<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL_Simple Preview</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/preview.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GL_Simple Preview</h1>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <div class="tabs">
            <a href="/" class="tab">Controls</a>
            <a href="/weather_editor" class="tab">Editor</a>
            <a href="/preview" class="tab active">Preview</a>
            <a href="/admin" class="tab">Admin</a>
        </div>

        <div class="preview-controls">
            <button class="mode-btn active" data-mode="flat-continuous">Flat</button>
            <button class="mode-btn" data-mode="fan-continuous">Fan</button>
            <button class="mode-btn" data-mode="flat-dots">Flat Dots</button>
            <button class="mode-btn" data-mode="fan-dots">Fan Dots</button>
            <span id="preview-fps" class="fps-label">-- FPS</span>
        </div>

        <div class="canvas-wrapper">
            <canvas id="preview-canvas"></canvas>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/js/socket-client.js"></script>
    <script src="/static/js/preview.js"></script>
</body>
</html>
