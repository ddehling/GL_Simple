<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Set Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .info-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            opacity: 0.8;
        }
        
        .info-value {
            font-weight: 700;
            color: #4CAF50;
        }
        
        .sets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .set-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .set-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .set-card.active {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }
        
        .set-card.pending {
            border-color: #FFC107;
            background: rgba(255, 193, 7, 0.2);
        }
        
        .set-title {
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .set-badge {
            font-size: 0.7em;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(76, 175, 80, 0.8);
        }
        
        .set-badge.pending {
            background: rgba(255, 193, 7, 0.8);
        }
        
        .set-description {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        .set-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.85em;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat {
            display: flex;
            flex-direction: column;
        }
        
        .stat-label {
            opacity: 0.7;
            font-size: 0.9em;
            margin-bottom: 3px;
        }
        
        .stat-value {
            font-weight: 700;
            color: #64B5F6;
        }
        
        .season-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .season-progress {
            height: 100%;
            background: linear-gradient(90deg, #2196F3, #4CAF50, #FFC107, #FF5722, #2196F3);
            transition: width 1s linear;
        }
        
        .back-link {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            text-decoration: none;
            color: #fff;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌦️ Weather Set Control</h1>
            <div style="margin-top: 15px;">
                <a href="/weather_editor" class="back-link" style="background: rgba(76, 175, 80, 0.3); margin-right: 10px;">
                    ⚙️ Open Weather Set Editor
                </a>
                <a href="/" class="back-link">← Back to Control Panel</a>
            </div>
        </header>
        
        <div class="info-panel">
            <div class="info-row">
                <span class="info-label">Current Set:</span>
                <span class="info-value" id="current-set">Loading...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Current Weather:</span>
                <span class="info-value" id="current-weather">Loading...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Season Progress:</span>
                <span class="info-value" id="season-value">0%</span>
            </div>
            <div class="season-bar">
                <div class="season-progress" id="season-progress" style="width: 0%"></div>
            </div>
        </div>
        
        <div class="sets-grid" id="sets-container">
            <div class="loading">Loading weather sets...</div>
        </div>
        
        <a href="/" class="back-link">← Back to Main Control Panel</a>
    </div>
    
    <script>
        const WEATHER_SET_DESCRIPTIONS = {
            "peaceful_forest": {
                name: "Peaceful Forest",
                description: "Gentle natural cycles with fireflies and light weather",
                icon: "🌲"
            },
            "storm_world": {
                name: "Storm World",
                description: "Intense weather with storms and high winds",
                icon: "⛈️"
            },
            "desert_realm": {
                name: "Desert Realm",
                description: "Harsh desert with sandstorms and volcanic activity",
                icon: "🏜️"
            },
            "ethereal_mist": {
                name: "Ethereal Mist",
                description: "Mysterious foggy realm with supernatural elements",
                icon: "🌫️"
            },
            "cosmic_night": {
                name: "Cosmic Night",
                description: "Clear skies with meteors and celestial events",
                icon: "🌌"
            },
            "full_spectrum": {
                name: "Full Spectrum",
                description: "All weather states available - maximum variety",
                icon: "🌈"
            }
        };
        
        let currentSet = null;
        let pendingSet = null;
        
        async function fetchSetInfo() {
            try {
                const response = await fetch('/api/weather_set/info');
                const data = await response.json();
                
                currentSet = data.current_set;
                
                document.getElementById('current-set').textContent = 
                    WEATHER_SET_DESCRIPTIONS[currentSet]?.name || currentSet;
                document.getElementById('current-weather').textContent = data.current_weather;
                
                const seasonPercent = (data.season * 100).toFixed(1);
                document.getElementById('season-value').textContent = seasonPercent + '%';
                document.getElementById('season-progress').style.width = seasonPercent + '%';
                
                renderSets(data.available_sets);
            } catch (error) {
                console.error('Error fetching set info:', error);
            }
        }
        
        function renderSets(availableSets) {
            const container = document.getElementById('sets-container');
            container.innerHTML = '';
            
            availableSets.forEach(setKey => {
                const setInfo = WEATHER_SET_DESCRIPTIONS[setKey] || {
                    name: setKey,
                    description: "No description available",
                    icon: "📦"
                };
                
                const card = document.createElement('div');
                card.className = 'set-card';
                
                if (setKey === currentSet) {
                    card.classList.add('active');
                }
                if (setKey === pendingSet) {
                    card.classList.add('pending');
                }
                
                card.innerHTML = `
                    <div class="set-title">
                        <span>${setInfo.icon}</span>
                        <span>${setInfo.name}</span>
                        ${setKey === currentSet ? '<span class="set-badge">ACTIVE</span>' : ''}
                        ${setKey === pendingSet ? '<span class="set-badge pending">PENDING</span>' : ''}
                    </div>
                    <div class="set-description">${setInfo.description}</div>
                `;
                
                card.onclick = () => changeSet(setKey);
                container.appendChild(card);
            });
        }
        
        async function changeSet(setKey) {
            if (setKey === currentSet) {
                return; // Already active
            }
            
            try {
                const response = await fetch('/api/weather_set/change', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ set_name: setKey })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    pendingSet = setKey;
                    renderSets(Object.keys(WEATHER_SET_DESCRIPTIONS));
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error changing set:', error);
                alert('Failed to change weather set');
            }
        }
        
        // Update info every 2 seconds
        fetchSetInfo();
        setInterval(fetchSetInfo, 2000);
    </script>
</body>
</html>
