<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucifera Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .tab {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px 10px 0 0;
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .tab.active {
            background: rgba(0, 255, 255, 0.2);
            border-bottom: 3px solid #00ffff;
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 40px;
        }
        
        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ffff;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            color: #fff;
            font-size: 1em;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        
        button.primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00ffff 0%, #00cccc 100%);
            border: none;
            border-radius: 5px;
            color: #000;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
        }
        
        button.primary:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .admin-content {
            display: none;
        }
        
        .admin-content.active {
            display: block;
        }
        
        .info-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .info-card h3 {
            margin-bottom: 15px;
            color: #00ffff;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: bold;
            opacity: 0.8;
        }
        
        .info-value {
            color: #00ffff;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .action-button {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .action-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        
        .action-button.danger:hover {
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }
        
        .logout-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .logout-button:hover {
            background: rgba(255, 0, 0, 0.4);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div id="login-container" class="login-container">
        <h2>🔒 Admin Login</h2>
        <div id="error-message" class="error-message"></div>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>
            <button type="submit" class="primary">Login</button>
        </form>
    </div>
    
    <!-- Admin Panel Content -->
    <div id="admin-content" class="admin-content">
        <button class="logout-button" onclick="logout()">Logout</button>
        
        <div class="container">
            <header>
                <h1>🛠️ Admin Panel</h1>
            </header>
            
            <div class="tabs">
                <a href="/" class="tab">Controls</a>
                <a href="/preview" class="tab">Preview</a>
                <a href="/admin" class="tab active">Admin</a>
            </div>
            
            <div class="info-card">
                <h3>System Information</h3>
                <div id="system-info">
                    <div class="info-row">
                        <span class="info-label">Loading...</span>
                        <span class="info-value">Please wait</span>
                    </div>
                </div>
            </div>
            
            <div class="info-card">
                <h3>Control Dictionary</h3>
                <div id="control-dict">
                    <pre style="color: #00ffff; overflow-x: auto;"></pre>
                </div>
            </div>
            
            <div class="info-card">
                <h3>Admin Actions</h3>
                <div class="action-buttons">
                    <button class="action-button" onclick="refreshSystemInfo()">
                        🔄 Refresh System Info
                    </button>
                    <button class="action-button" onclick="downloadConfig()">
                        💾 Download Config
                    </button>
                    <button class="action-button" onclick="resetAllControls()">
                        ↺ Reset All Controls
                    </button>
                    <button class="action-button danger" onclick="clearSessions()">
                        🗑️ Clear All Sessions
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let authenticated = false;
        
        // Check authentication status on page load
        async function checkAuth() {
            try {
                const response = await fetch('/api/admin/check');
                const data = await response.json();
                
                if (!data.admin_enabled) {
                    showError('Admin panel is not enabled on this server');
                    return;
                }
                
                if (data.authenticated) {
                    showAdminPanel();
                } else {
                    showLoginForm();
                }
            } catch (error) {
                showError('Failed to connect to server');
            }
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    authenticated = true;
                    showAdminPanel();
                } else {
                    showError(data.error || 'Login failed');
                }
            } catch (error) {
                showError('Failed to connect to server');
            }
        }
        
        async function logout() {
            try {
                await fetch('/api/admin/logout', { method: 'POST' });
                authenticated = false;
                showLoginForm();
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }
        
        function showLoginForm() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('admin-content').classList.remove('active');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
        
        function showAdminPanel() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('admin-content').classList.add('active');
            loadAdminData();
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        async function loadAdminData() {
            await refreshSystemInfo();
            await loadControlDict();
            // Refresh every 5 seconds
            setInterval(refreshSystemInfo, 5000);
            setInterval(loadControlDict, 3000);
        }
        
        async function refreshSystemInfo() {
            try {
                const response = await fetch('/api/admin/system_info');
                if (response.status === 401) {
                    logout();
                    return;
                }
                
                const data = await response.json();
                
                const formatValue = (val) => {
                    if (typeof val === 'number') return val.toFixed(1) + '%';
                    return val;
                };
                
                const html = `
                    <div class="info-row">
                        <span class="info-label">Hostname:</span>
                        <span class="info-value">${data.hostname}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Platform:</span>
                        <span class="info-value">${data.platform}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Python Version:</span>
                        <span class="info-value">${data.python_version}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">CPU Usage:</span>
                        <span class="info-value">${formatValue(data.cpu_percent)}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Memory Usage:</span>
                        <span class="info-value">${formatValue(data.memory_percent)}</span>
                    </div>
                `;
                
                document.getElementById('system-info').innerHTML = html;
            } catch (error) {
                console.error('Failed to load system info:', error);
            }
        }
        
        async function loadControlDict() {
            try {
                const response = await fetch('/api/values');
                const data = await response.json();
                
                document.querySelector('#control-dict pre').textContent = 
                    JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Failed to load control dict:', error);
            }
        }
        
        async function downloadConfig() {
            try {
                const response = await fetch('/api/values');
                const data = await response.json();
                
                const blob = new Blob([JSON.stringify(data, null, 2)], 
                    { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `glsimple_config_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Failed to download config:', error);
            }
        }
        
        async function resetAllControls() {
            if (!confirm('Are you sure you want to reset all controls to defaults?')) {
                return;
            }
            
            try {
                const schemaResponse = await fetch('/api/schema');
                const schema = await schemaResponse.json();
                
                const defaults = {};
                for (const [key, config] of Object.entries(schema)) {
                    defaults[key] = config.default;
                }
                
                await fetch('/api/batch_update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(defaults),
                });
                
                alert('All controls reset to defaults');
            } catch (error) {
                console.error('Failed to reset controls:', error);
            }
        }
        
        function clearSessions() {
            if (!confirm('This will log out all users. Continue?')) {
                return;
            }
            
            // Note: This is a client-side only action
            // Server-side session clearing would require additional implementation
            logout();
        }
        
        // Initialize on page load
        checkAuth();
    </script>
</body>
</html>
