[Display]
# Show the rendering window (set to False for headless mode)
show_rendering_window = True

# Display magnification for the OpenCV window (1-5)
magnification = 3

# Show FPS counter (prints every 500 frames)
show_fps = True

# Target frame rate (frames per second)
target_fps = 40

[Audio]
# Microphone device name (leave empty to use default device)
# Common values: "TONOR", "", "default"
microphone_device = ""

[WebControl]
# Enable web control interface (set to False for max performance)
enable_web_control = True

# Web server port
web_port = 5000

# Web server service name (for mDNS discovery)
service_name = glsimple

# Admin panel password
admin_password = admin123

[Startup]
# Initial weather set on startup (e.g., "default", "ocean", "desert", "forest")
# Leave empty to use default, or set to a specific weather set
startup_weather_set = ocean

# Initial weather state (leave empty for default)
# Examples: CLEAR, OCEAN_KELP_FOREST, RAIN, FOG, etc.
startup_weather_state = OCEAN_KELP_FOREST

# Apply startup weather immediately (True) or transition to it (False)
immediate_startup = True

[Performance]
# Frame dimensions for each display (comma-separated list of width,height pairs)
# Format: width1,height1;width2,height2;...
# Example: 128,300;256,256 for two displays
frame_dimensions = 128,300

# Use shader renderer (True recommended)
use_shader_renderer = True

# Enable high-precision timing on Windows (requires winmm.dll)
enable_precision_timing = True

[Debug]
# Print debug information
debug_mode = False

# Enable tree visualization (debug feature)
show_tree = False

# Enable skyfull mode (debug feature)
show_skyfull = False
